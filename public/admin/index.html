<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Optiyou Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script src="/admin/admin.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Optiyou Admin</h1>
          <p>Review missing-product contributions, search products, and audit product truth.</p>
        </div>
        <p class="status">Deploy behind Cloudflare Access.</p>
      </header>

      <section>
        <h2>Metrics</h2>
        <button id="refresh-metrics" type="button">Refresh</button>
        <div id="metrics"></div>
      </section>

      <div class="grid">
        <section>
          <h2>Product Search</h2>
          <div class="row">
            <input id="query" placeholder="GTIN, product, or brand" />
            <button id="search" type="button">Search</button>
          </div>
          <div id="products"></div>
        </section>

        <section>
          <h2>Waitlist</h2>
          <div class="row">
            <button id="refresh-waitlist" type="button">Load</button>
            <button id="export-waitlist" class="secondary" type="button">Export CSV</button>
          </div>
          <div id="waitlist"></div>
        </section>

        <section>
          <h2>Review Queue</h2>
          <button id="refresh" type="button">Refresh</button>
          <div id="queue"></div>
        </section>

        <section>
          <h2>Evidence Cards (ATLAS)</h2>
          <div class="row">
            <select id="evidence-status" aria-label="Filter by review status">
              <option value="">all statuses</option>
              <option value="draft">draft</option>
              <option value="approved">approved</option>
              <option value="rejected">rejected</option>
            </select>
            <button id="load-evidence" type="button">Load</button>
          </div>
          <div id="evidence"></div>
        </section>
      </div>
    </main>
  </body>
</html>
